<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cafetería · Decorator</title>
  <style>
    :root { --bg:#f6efe7; --card:#fff; --ink:#3b2a20; --accent:#8a5a3c; --muted:#8d7b6e; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1rem;
           background:var(--bg); color:var(--ink); font-family: system-ui, sans-serif; }
    main { width:min(480px,100%); background:var(--card); border-radius:16px; padding:1.5rem;
           box-shadow:0 8px 30px rgba(59,42,32,.12); }
    h1 { margin:0 0 1rem; font-size:1.4rem; }
    fieldset { border:1px solid #e6dacd; border-radius:10px; margin:0 0 1rem; padding:.75rem 1rem; }
    legend { color:var(--muted); font-size:.85rem; padding:0 .4rem; }
    label { display:inline-flex; align-items:center; gap:.4rem; margin-right:1rem; cursor:pointer; }
    select, input[type=number] { padding:.35rem; border-radius:6px; border:1px solid #d8c9ba; }
    .resumen { background:var(--bg); border-radius:10px; padding:1rem; min-height:90px; }
    .desc { margin:0 0 .5rem; }
    .costo { font-size:2rem; font-weight:700; color:var(--accent); margin:0; }
    .error { color:#b3261e; }
    .cargando { opacity:.5; transition:opacity .2s; }
  </style>
</head>
<body>
<main>
  <h1>☕ Arma tu bebida</h1>

  <form id="form" onsubmit="return false">
    <fieldset>
      <legend>Base</legend>
      <label><input type="radio" name="base" value="espresso" checked> Espresso</label>
      <label><input type="radio" name="base" value="te"> Té</label>
    </fieldset>

    <fieldset>
      <legend>Tamaño</legend>
      <label><input type="radio" name="tamano" value="PEQUENO" checked> Pequeño</label>
      <label><input type="radio" name="tamano" value="MEDIANO"> Mediano</label>
      <label><input type="radio" name="tamano" value="GRANDE"> Grande</label>
    </fieldset>

    <fieldset>
      <legend>Extras</legend>
      <p><label>Shots extra
        <input type="number" id="shots" min="0" max="4" value="0" style="width:4rem"></label></p>
      <label><input type="checkbox" name="jarabe" value="vainilla"> Jarabe vainilla</label>
      <label><input type="checkbox" name="jarabe" value="caramelo"> Jarabe caramelo</label>
      <label><input type="checkbox" name="jarabe" value="avellana"> Jarabe avellana</label>
    </fieldset>
  </form>

  <section class="resumen" id="resumen" aria-live="polite">
    <p class="desc" id="desc">—</p>
    <p class="costo" id="costo">—</p>
  </section>
</main>

<script>
  const form  = document.getElementById('form');
  const resumen = document.getElementById('resumen');
  const descEl = document.getElementById('desc');
  const costoEl = document.getElementById('costo');
  let controlador = null;

  function leerSeleccion() {
    const base   = form.elements['base'].value;
    const tamano = form.elements['tamano'].value;
    const shots  = Math.max(0, Math.min(4, parseInt(document.getElementById('shots').value, 10) || 0));
    const extras = [];
    for (let i = 0; i < shots; i++) extras.push('SHOT');
    form.querySelectorAll('input[name=jarabe]:checked')
        .forEach(c => extras.push('JARABE:' + c.value));
    return { base, tamano, extras };
  }

  async function actualizar() {
    if (controlador) controlador.abort();
    controlador = new AbortController();
    resumen.classList.add('cargando');
    try {
      const res = await fetch('/api/pedido/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(leerSeleccion()),
        signal: controlador.signal
      });
      if (!res.ok) throw new Error('Error ' + res.status);
      const data = await res.json();
      descEl.textContent = data.descripcion;
      descEl.classList.remove('error');
      costoEl.textContent = '$' + Number(data.costo).toFixed(2);
    } catch (e) {
      if (e.name === 'AbortError') return;
      descEl.textContent = 'No se pudo calcular el pedido. Reintenta.';
      descEl.classList.add('error');
      costoEl.textContent = '—';
    } finally {
      resumen.classList.remove('cargando');
    }
  }

  form.addEventListener('change', actualizar);
  form.addEventListener('input', actualizar);
  actualizar();
</script>
</body>
</html>
